[SERVICE]
    Flush         1
    Daemon        Off
    Log_Level     info
    Parsers_File  parsers.conf

[INPUT]
    Name                tail
    Path                /var/lib/docker/containers/*/*.log
    Parser              docker
    Tag                 docker.*
    Refresh_Interval    5
    Mem_Buf_Limit       10MB
    Skip_Long_Lines     On
    DB                  /var/log/flb_containers.db

# Keep only log-demo lines. Broaden or remove for all containers.
[FILTER]
    Name                grep
    Match               docker.*
    Regex               log log-demo

[FILTER]
    Name                parser
    Match               docker.*
    Key_Name            log
    Parser              json
    Reserve_Data        On

# HTTP → Data Prepper 
[OUTPUT]
    Name                http
    Match               docker.*
    Host                data-prepper
    Port                2022
    URI                 /container/logs
    Format              json
    Json_Date_Key       false
